# SharedCareer :: publish a release
#
# On every push to main:
#   1. run all tests (tools/test.sh)
#   2. build the package (tools/package.sh -> SharedCareer-<version>.zip)
#   3. if there is no release "v<version>" yet, it is created and the zip attached.
#      If the version already exists, nothing happens. So a new release is created exactly
#      when the version (util.lua + main.lua) was raised: when the release pull request of
#      prepare-release.yml is merged. Its text is the notes (tools/release_notes.sh).
#   4. post the new release with its notes to Discord (tools/discord_release.sh), if the
#      repository secret DISCORD_RELEASE_WEBHOOK holds a webhook of the releases channel.
#
# On the server, "./server.sh update" then fetches the newest release (see tools/server.sh).

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # with tags: tests/config_update_test.lua compares the settings with the last release

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.3 zip

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^local VERSION = "\(.*\)"/\1/p' Resources/Server/SharedCareer/main.lua)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Does the release exist already?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} exists already - no new release (the \"Prepare release\" workflow raises the version)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests and build the package
        run: |
          tools/test.sh
          tools/package.sh

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          tools/release_notes.sh > release_notes.md
          gh release create "v$v" "SharedCareer-$v.zip" \
            --title "SharedCareer $v" \
            --notes-file release_notes.md

      - name: Post the release on Discord
        if: steps.exists.outputs.exists == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          v="${{ steps.version.outputs.version }}"
          tools/discord_release.sh "$v" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v" release_notes.md
