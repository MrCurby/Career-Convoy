# SharedCareer :: checks of a pull request into main
#
#   tests          all tests and the Lua formatting (tools/test.sh)
#   version        only a release pull request raises the version; tools/server.sh changes
#                  raise its SCRIPT_REVISION (tools/version_check.sh)
#
# "Run workflow" (workflow_dispatch) is used by prepare-release.yml: the release pull request it
# opens doesn't start these checks by itself.
# Make both required in the repository's ruleset for main ("Require status checks to pass").

name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # with tags: tests/config_update_test.lua compares the settings with the last release

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.3 zip
          npm install -g @johnnymorganz/stylua-bin@2.6.0

      - name: Run all tests
        run: tools/test.sh

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        run: tools/version_check.sh "origin/${{ github.base_ref || 'main' }}" "${{ github.head_ref || github.ref_name }}"
