# SharedCareer :: prepare a release (the "Run workflow" button)
#
# Actions → "Prepare release" → Run workflow → patch (fixes) or minor (new features).
# Runs on GitHub, so it works from any computer, nothing to install:
#   1. raise the version on a new branch release/v<version> (tools/bump.sh, which runs the tests)
#   2. open the pull request "SharedCareer <version>". Its text is the release notes, collected
#      from the pull requests merged since the last release (tools/release_notes.sh); edit them
#      there if needed.
#   3. start the checks (tests.yml) for it: a pull request opened by a workflow doesn't start them
#      by itself.
# If the mod is unchanged since the last release, it only leaves a note and opens nothing.
# Merging that pull request publishes the release and posts it to Discord (release.yml).
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".

name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch = fixes, minor = new features'
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # with tags: the notes and the tests compare with the last release

      - name: Anything to release?
        id: changes
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          if [ -z "$(git diff --name-only "$last" HEAD -- client Resources tools/server.sh)" ]; then
            echo "::notice::Nothing to release: the mod is unchanged since $last."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.changes.outputs.release == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.3 zip

      - name: Open the release pull request
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "<!-- The release notes (GitHub and Discord). Edit them here before merging. -->"
            echo
            tools/release_notes.sh; } > "$RUNNER_TEMP/notes.md"
          tools/bump.sh "${{ inputs.bump }}"
          v=$(sed -n 's/^local VERSION = "\(.*\)"/\1/p' Resources/Server/SharedCareer/main.lua)
          branch="release/v$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "SharedCareer $v"
          git push -f origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "SharedCareer $v" --body-file "$RUNNER_TEMP/notes.md"
          else
            gh pr create --base main --head "$branch" --title "SharedCareer $v" --body-file "$RUNNER_TEMP/notes.md"
          fi
          gh workflow run tests.yml --ref "$branch"
          echo "Release pull request: $(gh pr view "$branch" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
