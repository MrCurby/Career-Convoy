# Lua formatting with StyLua (https://github.com/JohnnyMorganz/StyLua), checked by tools/test.sh.
# Format everything: stylua .   In VS Code: the "StyLua" extension (JohnnyMorganz.stylua).
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
