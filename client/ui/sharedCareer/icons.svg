<!-- SharedCareer :: every icon of the UI apps, in one place. Each one is a symbol "sc-icon-<name>"
     in a 24x24 box, drawn in currentColor (the color of the text around it). Both apps load this file
     into their page (ng-include in phone.html); an icon is then <svg><use href="#sc-icon-car"/></svg>, its
     size set by the CSS of the place it is in. See docs/development.md, "Icons". -->
<svg xmlns="http://www.w3.org/2000/svg" class="sc-icons" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
	<!-- the SharedCareer logo, the phone -->
	<symbol id="sc-icon-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12.6" r="2.7" fill="currentColor"/><path d="M3.2 11.2 Q12 8.2 20.8 11.2 M12 15.3 V21.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
	<symbol id="sc-icon-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
