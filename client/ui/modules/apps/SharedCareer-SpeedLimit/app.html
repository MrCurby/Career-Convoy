<div ng-controller="SharedCareerSpeedLimit" class="scs-host">
	<!-- the sign: round with a red ring (km/h) or a US "SPEED LIMIT" sign (mph); pulses red while
	     you are too fast. Nothing may stand before this <div> (replace: true, see app.js). -->
	<link rel="stylesheet" type="text/css" href="/ui/modules/apps/SharedCareer-SpeedLimit/app.css">
	<div class="scs-sign" ng-if="sign.limit"
		ng-class="{'scs-us': sign.unit === 'mph', 'scs-over': sign.over}"
		title="{{ 'Speed limit: ' + sign.limit + ' ' + sign.unit }}">
		<span class="scs-title" ng-if="sign.unit === 'mph'">SPEED<br>LIMIT</span>
		<span class="scs-limit" ng-bind="sign.limit"></span>
	</div>
</div>
