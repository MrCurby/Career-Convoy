<div ng-controller="CareerConvoyPhone" class="scMenu scPhone" ng-show="enabled">
	<!-- The phone: its shell (status bar, home screen, app bar, calls) is here, the screen of each
	     built-in app in apps/<name>.html, the parts they share in shared/. Nothing may stand before
	     this <div> (not even a comment): the directive uses replace: true, which needs exactly one
	     root element (see app.js). -->
	<!-- the tab's style comes from the Career-Convoy menu, the phone's own from app.css -->
	<link rel="stylesheet" type="text/css" href="/ui/modules/apps/CareerConvoy-Menu/app.css">
	<link rel="stylesheet" type="text/css" href="/ui/modules/apps/CareerConvoy-Phone/app.css">
	<!-- every icon, from ui/careerConvoy/icons.svg; one by its name is <scp-icon name="car"></scp-icon> -->
	<div ng-include="'/ui/careerConvoy/icons.svg'"></div>

	<!-- The phone is attached to <body> on start (app.js), so the app frame (only the tab) never
	     clips it and never blocks clicks elsewhere. Only the phone itself takes clicks. -->
	<div class="scp-host" id="careerConvoyPhoneHost">
		<div class="scp-phone" ng-if="open && enabled">
			<div class="scp-screen">
				<!-- the wallpaper (Settings), behind the home screen -->
				<div class="scp-wallpaper" ng-if="!currentApp" ng-style="wallpaperStyle()"></div>
				<div class="scp-notch"></div>

				<!-- status bar: server time, players, connection -->
				<div class="scp-status">
					<span ng-bind="clock()"></span>
					<span class="scp-status-right">
						<span class="scp-players" title="Players on the server">
							<scp-icon name="players"></scp-icon>
							<span ng-bind="playerCount()"></span>
						</span>
						<span class="scp-signal" ng-class="{'scp-signal-off': !connected}"
							title="{{ connected ? 'Connected to the server' : 'No connection' }}">
							<i></i><i></i><i></i><i></i>
						</span>
					</span>
				</div>

				<!-- home screen: the clock, day or night, the apps -->
				<div class="scp-home" ng-if="!currentApp">
					<div class="scp-hero">
						<div class="scp-clock" ng-bind="clock()"></div>
						<div class="scp-day" ng-bind="dayText()"></div>
						<!-- how much of the day / night is over: sun -> moon by day, moon -> sun by night -->
						<div class="scp-phase" ng-if="phaseProgress() !== null"
							ng-class="{'scp-phase-night': !timeInfo.isDay}"
							title="How much of the {{ timeInfo.isDay ? 'day' : 'night' }} is over">
							<span ng-bind="timeInfo.isDay ? '☀' : '☾'"></span>
							<span class="scp-phase-bar"><i ng-style="{'width': (phaseProgress() * 100) + '%'}"></i></span>
							<span ng-bind="timeInfo.isDay ? '☾' : '☀'"></span>
						</div>
					</div>
					<div class="scp-grid" ng-if="homeApps.length">
						<button class="scp-app" ng-repeat="app in homeApps track by app.id" ng-click="openApp(app)"
							title="{{ app.title }}">
							<span class="scp-app-icon" ng-class="appIconClass()" ng-style="appIconStyle(app)">
								<scp-icon ng-if="hasIcon(app.icon)" name="{{ app.icon }}"></scp-icon>
								<span ng-if="!hasIcon(app.icon)" ng-bind="app.icon"></span>
							</span>
							<span class="scp-app-title" ng-bind="app.title"></span>
						</button>
					</div>
					<div class="scp-card scp-empty" ng-if="!homeApps.length">
						<scp-icon name="logo"></scp-icon>
						<b>No apps yet</b>
						<span>Apps show up here.</span>
					</div>
				</div>

				<!-- an open app: the app bar, then the app's screen -->
				<div class="scp-appview" ng-if="currentApp">
					<div class="scp-appbar">
						<!-- back: from a page inside an app (a job type in Jobs) to its start page, else home -->
						<button class="scp-back" ng-click="goBack()">
							<scp-icon name="chevron-left"></scp-icon>
							<span ng-bind="canGoBackInApp() ? currentApp.title : 'Home'"></span>
						</button>
						<span class="scp-appbar-title" ng-bind="appTitle()"></span>
					</div>
					<!-- your job, as a strip above the apps you use for it (Tow, Straps); opens it in Jobs -->
					<button class="scp-jobstrip" ng-if="jobStripShown()" ng-click="openJobs()"
						title="Open the Jobs app">
						<span class="scp-pill scp-pill-accent">Job</span>
						<span class="scp-jobstrip-text" ng-bind="jobStepText()"></span>
						<span class="scp-dim-text" ng-if="jobs.active.distance !== undefined"
							ng-bind="formatDistance(jobs.active.distance)"></span>
					</button>
					<!-- the screen of a built-in app (apps/<id>.html, appScreen in app.js); each file says at
					     its top what it shows -->
					<div class="scp-appscreen" ng-if="appScreen()" ng-include="appScreen()"></div>
					<!-- an app without a screen of its own: its icon, large -->
					<div class="scp-appbody scp-appbody-center" ng-if="!appScreen()">
						<span class="scp-app-icon scp-app-icon-big" ng-class="appIconClass()" ng-style="appIconStyle(currentApp)">
							<scp-icon ng-if="hasIcon(currentApp.icon)" name="{{ currentApp.icon }}"></scp-icon>
							<span ng-if="!hasIcon(currentApp.icon)" ng-bind="currentApp.icon"></span>
						</span>
					</div>
				</div>

				<!-- an incoming call (phone.lua ring), over everything until it is answered or rings out:
				     the bar runs down while it rings -->
				<div class="scp-call" ng-if="call">
					<span class="scp-call-icon"><scp-icon ng-if="hasIcon(call.icon)" name="{{ call.icon }}"></scp-icon></span>
					<div class="scp-call-title" ng-bind="call.title"></div>
					<div class="scp-call-text" ng-if="call.text" ng-bind="call.text"></div>
					<div class="scp-dim-text" ng-if="call.detail" ng-bind="call.detail"></div>
					<div class="scp-call-timer"><i class="scp-call-timer-bar" ng-style="{'animation-duration': call.seconds + 's'}"></i></div>
					<div class="scp-call-buttons">
						<button class="scp-btn scp-btn-l scp-btn-danger" ng-click="answerCall(false)">Decline</button>
						<button class="scp-btn scp-btn-l scp-btn-ok" ng-click="answerCall(true)">Accept</button>
					</div>
				</div>

				<!-- home bar: back to the home screen; on the home screen it puts the phone away -->
				<div class="scp-homebar" ng-click="homeBar()" title="{{ currentApp ? 'Home' : 'Put the phone away' }}">
					<i></i>
				</div>
			</div>
		</div>
	</div>

	<!-- tab at the right edge: takes the phone out / puts it away -->
	<div class="scm-tab scp-tab" ng-class="{'scp-tab-open': open}" ng-click="toggle()"
		title="{{ open ? 'Put the phone away' : 'Take the phone out (F4)' }}">
		<scp-icon class="scm-logo" name="phone"></scp-icon>
		<span class="scm-tab-arrow" ng-bind="open ? '>' : '<'"></span>
	</div>
</div>
