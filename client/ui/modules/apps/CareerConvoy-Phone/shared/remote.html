<!-- The remote for a rope's loose end (ropeRemote.lua), used by the Tow app (the anchor) and the
     Straps app (a strap's end): hold an arrow to move it, as seen from the camera; the middle puts
     it where you look. The buttons go to the open app's Lua (nudge, nudgeStop, remoteToView in app.js). -->
<div class="scp-remote">
	<div class="scp-pad">
		<span></span>
		<button class="scp-btn scp-pad-key" title="Away from me (hold)" ng-mousedown="nudge(1,0,0)"
			ng-mouseup="nudgeStop()" ng-mouseleave="nudgeStop()"><scp-icon name="chevron-up"></scp-icon></button>
		<span></span>
		<button class="scp-btn scp-pad-key" title="Left (hold)" ng-mousedown="nudge(0,-1,0)"
			ng-mouseup="nudgeStop()" ng-mouseleave="nudgeStop()"><scp-icon name="chevron-left"></scp-icon></button>
		<button class="scp-btn scp-pad-key scp-pad-center" title="To the middle of my view"
			ng-click="remoteToView()"><scp-icon name="aim"></scp-icon></button>
		<button class="scp-btn scp-pad-key" title="Right (hold)" ng-mousedown="nudge(0,1,0)"
			ng-mouseup="nudgeStop()" ng-mouseleave="nudgeStop()"><scp-icon name="chevron-right"></scp-icon></button>
		<span></span>
		<button class="scp-btn scp-pad-key" title="Towards me (hold)" ng-mousedown="nudge(-1,0,0)"
			ng-mouseup="nudgeStop()" ng-mouseleave="nudgeStop()"><scp-icon name="chevron-down"></scp-icon></button>
		<span></span>
	</div>
	<div class="scp-lift">
		<button class="scp-btn scp-pad-key" title="Up (hold)" ng-mousedown="nudge(0,0,1)" ng-mouseup="nudgeStop()"
			ng-mouseleave="nudgeStop()"><scp-icon name="arrow-up"></scp-icon>Up</button>
		<button class="scp-btn scp-pad-key" title="Down (hold)" ng-mousedown="nudge(0,0,-1)" ng-mouseup="nudgeStop()"
			ng-mouseleave="nudgeStop()"><scp-icon name="arrow-down"></scp-icon>Down</button>
	</div>
</div>
