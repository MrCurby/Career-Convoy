<div ng-controller="CareerConvoyMenu" class="scMenu" ng-class="{'scm-collapsed': collapsed}">
	<link rel="stylesheet" type="text/css" href="/ui/modules/apps/CareerConvoy-Menu/app.css">
	<!-- every icon, from ui/careerConvoy/icons.svg: an icon by its name is <svg><use href="#sc-icon-car"/></svg> -->
	<div ng-include="'/ui/careerConvoy/icons.svg'"></div>

	<!-- Expanded: Career-Convoy menu with tabs (styled like the BeamMP player list) -->
	<div class="scm-panel" ng-if="!collapsed">
		<div class="scm-header">
			<span class="scm-brand scm-brand-click" title="Career-Convoy – click for the welcome overview" ng-click="showWelcome()"><svg class="scm-logo" aria-hidden="true"><use href="#sc-icon-logo"/></svg></span>
			<button class="scm-tabbtn" ng-class="{'scm-active': tab === 'time'}" ng-click="setTab('time')">Time</button>
			<button class="scm-tabbtn" ng-class="{'scm-active': tab === 'traffic'}" ng-click="setTab('traffic')">Traffic</button>
			<button class="scm-tabbtn" ng-class="{'scm-active': tab === 'options'}" ng-click="setTab('options')">Options</button>
			<button class="scm-tabbtn" ng-class="{'scm-active': tab === 'players'}" ng-click="setTab('players')">Players</button>
		</div>

		<div class="scm-body" ng-if="!state || !state.connected">
			<span class="scm-note">Only on a Career-Convoy server</span>
		</div>

		<!-- Time tab -->
		<div class="scm-body" ng-if="state && state.connected && tab === 'time'">
			<div class="scm-top">
				<span class="scm-icon" ng-bind="state.isDay ? '☀' : '☾'"></span>
				<span class="scm-clock" ng-bind="clock()"></span>
				<span class="scm-phase" ng-bind="phaseText()"></span>
			</div>
			<div class="scm-row" ng-if="state.canControl && !state.realtime">
				<span class="scm-seg">
					<button class="scm-btn" ng-click="shift(-1)" title="One hour back">−1 h</button>
					<button class="scm-btn" ng-click="shift(1)" title="One hour forward">+1 h</button>
				</span>
				<span class="scm-seg scm-end">
					<button class="scm-btn" ng-click="setHour(7)" title="7:00">Morning</button>
					<button class="scm-btn" ng-click="setHour(12)" title="12:00">Noon</button>
					<button class="scm-btn" ng-click="setHour(19)" title="19:00">Evening</button>
					<button class="scm-btn" ng-click="setHour(23)" title="23:00">Night</button>
				</span>
			</div>
			<div class="scm-row" ng-if="state.canControl && !state.realtime">
				<span class="scm-half">
					<span class="scm-label">Day</span>
					<span class="scm-stepper">
						<button class="scm-btn scm-step" ng-click="changeLength('day', -1)">−</button>
						<span class="scm-value" ng-bind="lengthText(lengths().day)"></span>
						<button class="scm-btn scm-step" ng-click="changeLength('day', 1)">+</button>
					</span>
				</span>
				<span class="scm-half scm-end">
					<span class="scm-label">Night</span>
					<span class="scm-stepper">
						<button class="scm-btn scm-step" ng-click="changeLength('night', -1)">−</button>
						<span class="scm-value" ng-bind="lengthText(lengths().night)"></span>
						<button class="scm-btn scm-step" ng-click="changeLength('night', 1)">+</button>
					</span>
				</span>
			</div>
			<div class="scm-row" ng-if="state.canControl">
				<span class="scm-label">Clock</span>
				<span class="scm-seg scm-end">
					<button class="scm-btn" ng-class="{'scm-on': clockMode() === 'run'}" ng-click="setClockMode('run')"
						title="Let the clock run">Run</button>
					<button class="scm-btn" ng-class="{'scm-on': clockMode() === 'pause'}" ng-click="setClockMode('pause')"
						title="Stop the clock">Pause</button>
					<button class="scm-btn" ng-class="{'scm-on': clockMode() === 'real'}" ng-click="setClockMode('real')"
						title="Follow the real clock">Real time</button>
				</span>
			</div>
			<div class="scm-note" ng-if="!state.canControl && state.synced">The time of day is set by the server</div>
			<div class="scm-note" ng-if="!state.synced">Time sync is off on this server</div>
		</div>

		<!-- Traffic tab: rows Driving / Parked, columns per player and server limit -->
		<div class="scm-body" ng-if="state && state.connected && state.settings && tab === 'traffic'">
			<div class="scm-row scm-colheads">
				<span class="scm-label"></span>
				<span class="scm-col">Per player</span>
				<span class="scm-col">Server max</span>
			</div>
			<div class="scm-row" ng-repeat="kind in ['road', 'parked']">
				<span class="scm-label" ng-bind="kind === 'road' ? 'Driving' : 'Parked'"></span>
				<span class="scm-col scm-stepper">
					<button class="scm-btn scm-step" ng-disabled="!canEdit()" ng-click="step(trafficKey(kind), -1, 0, 50)">−</button>
					<span class="scm-value" ng-bind="val(trafficKey(kind))"></span>
					<button class="scm-btn scm-step" ng-disabled="!canEdit()" ng-click="step(trafficKey(kind), 1, 0, 50)">+</button>
				</span>
				<span class="scm-col scm-stepper">
					<button class="scm-btn scm-step" ng-disabled="!canEdit()" ng-click="step(totalKey(kind), -2, 0, 400)">−</button>
					<span class="scm-value" title="{{ val(totalKey(kind)) === 0 ? 'No limit' : '' }}"
						ng-bind="val(totalKey(kind)) === 0 ? '∞' : val(totalKey(kind))"></span>
					<button class="scm-btn scm-step" ng-disabled="!canEdit()" ng-click="step(totalKey(kind), 2, 0, 400)">+</button>
				</span>
			</div>
			<div class="scm-row">
				<span class="scm-label">AI style</span>
				<span class="scm-seg">
					<button class="scm-btn" ng-disabled="!canEdit()" ng-class="{'scm-on': aggression() === 'careful'}" ng-click="setAggression(0.15)">Careful</button>
					<button class="scm-btn" ng-disabled="!canEdit()" ng-class="{'scm-on': aggression() === 'normal'}" ng-click="setAggression(0.3)">Normal</button>
					<button class="scm-btn" ng-disabled="!canEdit()" ng-class="{'scm-on': aggression() === 'fast'}" ng-click="setAggression(0.5)">Fast</button>
				</span>
			</div>
			<div class="scm-note" ng-bind="trafficNote()"></div>
		</div>

		<!-- Options tab -->
		<div class="scm-body" ng-if="state && state.connected && state.settings && tab === 'options'">
			<div class="scm-row" ng-repeat="o in OPTIONS">
				<span class="scm-label scm-grow" ng-bind="o.label"></span>
				<button class="scm-switch" ng-disabled="!canEdit()" ng-class="{'scm-on': optionOn(o)}" ng-click="toggle(o.key)"
					title="{{ optionOn(o) ? 'On' : 'Off' }}"><span class="scm-knob"></span></button>
			</div>
			<div class="scm-note" ng-if="!canEdit()">Only the server owner can change these</div>
		</div>

		<!-- Players tab -->
		<div class="scm-body" ng-if="state && state.connected && state.players && tab === 'players'">
			<div class="scm-row scm-watchbar" ng-if="state.players.watching">
				<span class="scm-label scm-grow">Watching {{ state.players.watching }}</span>
				<button class="scm-btn scm-on" ng-click="back()">Back to my car</button>
			</div>
			<div class="scm-row" ng-repeat="p in state.players.list track by p.name">
				<span class="scm-player scm-grow" ng-bind="p.name"></span>
				<span class="scm-you" ng-if="p.me">you</span>
				<span class="scm-status" ng-if="statusText(p.status)" ng-bind="statusText(p.status)"></span>
				<span class="scm-seg" ng-if="!p.me">
					<button class="scm-btn" ng-if="state.players.navigating !== p.name" ng-click="navigate(p.name)"
						title="Show the way to this player on the road">Navigate</button>
					<button class="scm-btn scm-on" ng-if="state.players.navigating === p.name" ng-click="stopNavigate()"
						title="Stop navigation">Stop</button>
					<button class="scm-btn" ng-click="watch(p.name)" title="Move the camera to this player">Watch</button>
					<button class="scm-btn" ng-if="state.players.canTeleport" ng-click="teleport(p.name)"
						title="Teleport your current vehicle to this player">Go</button>
				</span>
			</div>
			<div class="scm-note" ng-if="state.players.list.length <= 1">No other players online</div>
		</div>
	</div>

	<!-- Dialog (welcome, messages from the server) as a card in the middle of the screen – even when
	     the menu is collapsed. Text is only inserted as text (no HTML). -->
	<!-- The host is attached to <body> on start (app.js), so the app frame can't clip or move the
	     dialog (0.8.2: an invisible dialog blocked the tab). -->
	<div class="scMenu scm-dialog-host" id="careerConvoyDialogHost"><div class="scm-overlay" ng-if="dialog">
		<div class="scm-dialog" ng-class="{'scm-dialog-warn': dialog.warning}">
			<div class="scm-dialog-title" ng-bind="dialog.title"></div>
			<div class="scm-dialog-text" ng-if="dialog.intro" ng-bind="dialog.intro"></div>
			<ul class="scm-dialog-list" ng-class="{'scm-dialog-rows': dialog.kind === 'licenses'}"
				ng-if="dialog.items && dialog.items.length">
				<li ng-repeat="it in dialog.items">
					<b ng-bind="it.head"></b> <span ng-class="{'scm-owned': it.owned}" ng-bind="it.text"></span>
					<button class="scm-btn scm-dialog-btn scm-end" ng-if="it.buy" ng-disabled="it.disabled"
						ng-click="buy(it)">Buy</button>
				</li>
			</ul>
			<div class="scm-dialog-text scm-dialog-muted" ng-if="dialog.outro" ng-bind="dialog.outro"></div>
			<div class="scm-dialog-buttons">
				<button class="scm-btn scm-dialog-btn" ng-repeat="b in dialog.buttons" ng-class="{'scm-on': b.primary}"
					ng-click="dialogButton(b)" ng-bind="b.label"></button>
			</div>
		</div>
	</div></div>

	<!-- Tab at the right edge: collapses/expands. When collapsed, only the tab is visible. -->
	<div class="scm-tab" ng-click="toggleCollapsed()" title="{{ collapsed ? 'Expand Career-Convoy menu' : 'Collapse Career-Convoy menu' }}">
		<!-- Career-Convoy logo (steering wheel) -->
		<span class="scm-tab-icon" ng-if="collapsed"><svg class="scm-logo" aria-hidden="true"><use href="#sc-icon-logo"/></svg></span>
		<span class="scm-tab-arrow" ng-bind="collapsed ? '<' : '>'"></span>
	</div>
</div>
