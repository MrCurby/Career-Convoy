<div class="scp-appbody scp-tow scp-fuel">
	<div class="scp-seg">
		<button ng-class="{'scp-seg-on scp-seg-in': fuelSort === 'gasoline'}"
			ng-click="setFuelSort('gasoline')">Gasoline</button>
		<button ng-class="{'scp-seg-on scp-seg-in': fuelSort === 'diesel'}"
			ng-click="setFuelSort('diesel')">Diesel</button>
		<button ng-class="{'scp-seg-on scp-seg-in': fuelSort === 'distance'}"
			ng-click="setFuelSort('distance')">Nearest</button>
	</div>
	<div class="scp-station" ng-repeat="st in stations() track by st.id"
		ng-class="{'scp-cheapest': $first && fuelSort !== 'distance'}">
		<div class="scp-station-top">
			<span class="scp-station-name" ng-bind="st.name"></span>
			<span class="scp-row-right" ng-if="st.distance !== undefined"
				ng-bind="formatDistance(st.distance)"></span>
		</div>
		<div class="scp-station-bottom">
			<span class="scp-price" ng-repeat="f in ['gasoline', 'diesel']"
				ng-if="st.fuels[f]"
				ng-class="{'scp-price-main': f === mainFuel(), 'scp-price-off': st.fuels[f].discount > 0}">
				<span class="scp-fuelkey"
					ng-bind="f === 'gasoline' ? 'G' : 'D'"></span>{{
				formatPrice(st.fuels[f]) }}<span class="scp-disc"
					ng-if="st.fuels[f].discount > 0"> −{{ st.fuels[f].discount }}%</span>
			</span>
			<span class="scp-gap"></span>
			<button class="scp-go"
				ng-if="st.canNavigate && fuel.navigating !== st.id"
				ng-click="navigate(st.id)" title="Route to this station">Go</button>
			<button class="scp-go scp-go-on" ng-if="fuel.navigating === st.id"
				ng-click="stopNavigate()" title="Stop navigation">Stop</button>
		</div>
	</div>
	<div class="scp-hint" ng-if="!connected">Only on a SharedCareer
		server</div>
	<div class="scp-hint" ng-if="connected && !stations().length">No gas
		stations on this map</div>
	<div class="scp-hint" ng-if="stations().length">Green = cheaper after a
		delivery.</div>
</div>
