<!-- Settings, kept on this PC ("Settings app" in app.js): the wallpaper behind the home screen
     (ui/sharedCareer/wallpapers/) and the look of the app icons (app.css, scp-app-icon-<theme>),
     each shown as it would look, and when the speed limit sign shows (SharedCareer-SpeedLimit) -->
<div class="scp-appbody">
	<div class="scp-section-title">Wallpaper</div>
	<div class="scp-wallpapers" role="radiogroup">
		<button class="scp-option" ng-repeat="w in WALLPAPERS track by w.id" ng-click="setWallpaper(w.id)"
			ng-class="{'scp-option-on': look.wallpaper === w.id}" role="radio" aria-checked="{{ look.wallpaper === w.id }}">
			<span class="scp-wallpaper-thumb" ng-style="wallpaperStyle(w.id)"></span>
			<span ng-bind="w.name"></span>
		</button>
	</div>

	<div class="scp-section-title">App icons</div>
	<div class="scp-themes" role="radiogroup">
		<button class="scp-option scp-card" ng-repeat="t in ICON_THEMES track by t.id" ng-click="setIconTheme(t.id)"
			ng-class="{'scp-option-on': look.icons === t.id}" role="radio" aria-checked="{{ look.icons === t.id }}">
			<span class="scp-theme-icons">
				<span class="scp-app-icon scp-app-icon-mini" ng-repeat="app in apps | limitTo:3 track by app.id"
					ng-class="appIconClass(t.id)" ng-style="appIconStyle(app, t.id)">
					<scp-icon ng-if="hasIcon(app.icon)" name="{{ app.icon }}"></scp-icon>
					<span ng-if="!hasIcon(app.icon)" ng-bind="app.icon"></span>
				</span>
			</span>
			<span ng-bind="t.name"></span>
		</button>
	</div>

	<div class="scp-section-title">Speed limit sign</div>
	<scp-segment-select options="SIGN_MODES" selected="look.sign" on-select="setSignMode(id)"></scp-segment-select>
</div>
