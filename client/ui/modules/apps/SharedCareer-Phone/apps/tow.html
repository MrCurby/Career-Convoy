<div class="scp-appbody scp-tow">
	<!-- no rope yet: where I look (big), to the road, your vehicles nearby -->
	<div ng-if="!tow.attached">
		<div class="scp-hint scp-hint-box" ng-if="!tow.allowed">Ropes are off on
			this server.</div>
		<div ng-if="tow.allowed">
			<button class="scp-attach" ng-click="towCall('uiAttachView()')"
				title="Aim with the screen center">
				<span class="scp-attach-icon"><svg aria-hidden="true"><use
							href="#sc-icon-aim" /></svg></span>
				<span class="scp-attach-text"><b>Attach rope</b><span>Where I
						look</span></span>
			</button>
			<button class="scp-flip" ng-if="tow.flip"
				ng-click="towCall('uiFlipUpright()')"
				title="Put the vehicle you look at on its wheels (free)">
				<span class="scp-ic"><svg aria-hidden="true"><use
							href="#sc-icon-flip" /></svg></span><span>Flip upright</span>
			</button>
			<button class="scp-road" ng-if="tow.towToRoad"
				ng-click="towCall('uiTowToRoad()')"
				title="Put the vehicle you look at back on the road (free)">
				<span class="scp-ic"><svg aria-hidden="true"><use
							href="#sc-icon-road" /></svg></span><span>To the road</span>
			</button>
			<div class="scp-label" ng-if="tow.nearby.length">Your vehicles</div>
			<button class="scp-list-row scp-veh-row"
				ng-repeat="v in tow.nearby track by v.id"
				ng-click="towCall('uiAttachVehicle(' + v.id + ')')"
				title="Attach the rope">
				<span class="scp-veh-icon"><svg aria-hidden="true"><use
							href="#sc-icon-car-front" /></svg></span>
				<span class="scp-row-name" ng-bind="v.name"></span><span
					class="scp-row-right" ng-bind="v.distance + ' m'"></span>
				<span class="scp-veh-plus"><svg aria-hidden="true"><use
							href="#sc-icon-plus" /></svg></span>
			</button>
			<div class="scp-hint" ng-if="!tow.nearby.length">No vehicle
				nearby.</div>
		</div>
	</div>

	<!-- rope on: the rope at a glance, then the winch and the anchor, all on one screen -->
	<div ng-if="tow.attached">
		<div class="scp-tow-head">
			<span class="scp-tow-name" ng-bind="tow.vehicle"></span>
			<button class="scp-iconbtn scp-iconbtn-road" ng-if="tow.towToRoad"
				ng-click="towCall('uiTowToRoad()')"
				title="Put it back on the road (free)"><span class="scp-ic"><svg
						aria-hidden="true"><use href="#sc-icon-road" /></svg></span></button>
			<button class="scp-iconbtn scp-iconbtn-cut"
				ng-click="towCall('uiRelease()')" title="Remove the rope"><span
					class="scp-ic"><svg aria-hidden="true"><use
							href="#sc-icon-cut" /></svg></span></button>
		</div>

		<button class="scp-flip" ng-if="tow.flip"
			ng-click="towCall('uiFlipUpright()')"
			title="Put it on its wheels (free)">
			<span class="scp-ic"><svg aria-hidden="true"><use
						href="#sc-icon-flip" /></svg></span><span>Flip upright</span>
		</button>

		<!-- the rope: vehicle – rope (sags when slack, colored by its load, marks run while the winch turns) – anchor -->
		<div class="scp-ropeview" ng-class="ropeState().cls">
			<span class="scp-end scp-end-car" title="{{ tow.vehicle }}"><svg
					aria-hidden="true"><use href="#sc-icon-car-front" /></svg></span>
			<span class="scp-ropeline">
				<svg viewBox="0 0 100 30" preserveAspectRatio="none"
					aria-hidden="true">
					<path class="scp-rope-path" ng-attr-d="{{ ropePath() }}"
						vector-effect="non-scaling-stroke" />
					<path class="scp-rope-marks" ng-if="ropeRunning()"
						ng-class="{'scp-rope-in': tow.winch === 1}"
						ng-attr-d="{{ ropePath() }}" vector-effect="non-scaling-stroke" />
				</svg>
				<span class="scp-rope-len" ng-bind="meters(tow.length)"></span>
				<span class="scp-rope-state" ng-bind="ropeState().text"></span>
			</span>
			<span class="scp-end" ng-class="{'scp-end-hooked': tow.anchorVehicle}"
				title="{{ tow.anchorVehicle || 'Anchor' }}">
				<svg ng-if="tow.anchorVehicle" aria-hidden="true"><use
						href="#sc-icon-anchor-vehicle" /></svg>
				<svg ng-if="!tow.anchorVehicle" aria-hidden="true"><use
						href="#sc-icon-anchor" /></svg>
			</span>
		</div>

		<!-- Winch -->
		<div class="scp-panel">
			<div class="scp-panel-head">
				<span class="scp-panel-title"><span class="scp-ic"><svg
							aria-hidden="true"><use
								href="#sc-icon-winch" /></svg></span>Winch</span>
				<span class="scp-segs" title="How hard the winch works"><i
						ng-repeat="n in winchSegs track by $index"
						ng-style="segStyle($index)"></i></span>
				<span class="scp-meter-text"
					ng-class="{'scp-meter-limit': tow.winch === 1 && tow.strain >= 0.95}"
					ng-bind="winchText()"></span>
			</div>
			<div class="scp-wbtns">
				<button class="scp-wbtn" ng-class="{'scp-wbtn-out': tow.winch === -1}"
					ng-click="towCall('uiWinch(-1)')" title="The rope gets longer"><span
						class="scp-ic"><svg aria-hidden="true"><use
								href="#sc-icon-winch-out" /></svg></span><span>Pay
						out</span></button>
				<button class="scp-wbtn" ng-class="{'scp-wbtn-stop': tow.winch === 0}"
					ng-click="towCall('uiWinch(0)')" title="Lock the rope"><span
						class="scp-ic"><svg aria-hidden="true"><use
								href="#sc-icon-stop" /></svg></span><span>Stop</span></button>
				<button class="scp-wbtn" ng-class="{'scp-wbtn-in': tow.winch === 1}"
					ng-click="towCall('uiWinch(1)')"
					title="Pull the vehicle to the anchor"><span class="scp-ic"><svg
							aria-hidden="true"><use
								href="#sc-icon-winch-in" /></svg></span><span>Haul
						in</span></button>
			</div>
			<div class="scp-strength" ng-class="{'scp-strength-warn': tow.stuck}"
				title="Pull strength, in % of the vehicle's weight">
				<span class="scp-strength-name">Strength</span>
				<button class="scp-pick" ng-repeat="s in tow.strengths"
					ng-class="{'scp-pick-on': tow.strength === s}"
					ng-click="towCall('uiStrength(' + s + ')')">{{s}}%</button>
			</div>
			<div class="scp-hint scp-hint-warn" ng-if="tow.stuck">Too heavy? Use
				more strength.</div>
		</div>

		<!-- Anchor: hooked onto a vehicle, or the remote to move it -->
		<div class="scp-panel">
			<div class="scp-panel-head">
				<span class="scp-panel-title"><span class="scp-ic"><svg
							aria-hidden="true"><use
								href="#sc-icon-anchor" /></svg></span>Anchor</span>
				<span class="scp-panel-info"
					ng-if="!tow.anchorVehicle && tow.distance !== undefined"
					ng-bind="meters(tow.distance)"
					title="From the vehicle to the anchor"></span>
				<button class="scp-fine" ng-if="!tow.anchorVehicle"
					ng-class="{'scp-fine-on': tow.fine}"
					ng-click="towCall('uiFine(' + !tow.fine + ')')"
					title="Slower, for exact placing">Fine</button>
			</div>
			<div class="scp-hooked" ng-if="tow.anchorVehicle">
				<span class="scp-hooked-icon"><svg aria-hidden="true"><use
							href="#sc-icon-anchor-vehicle" /></svg></span>
				<span class="scp-hooked-text">
					<span class="scp-hooked-label"
						ng-bind="tow.anchorHitch ? 'On the hitch of' : 'Hooked onto'"></span>
					<span class="scp-hooked-title" ng-bind="tow.anchorVehicle"></span>
				</span>
				<button class="scp-go" ng-click="towCall('uiUnhook()')"
					title="The anchor stays where it is">Unhook</button>
			</div>
			<button class="scp-hookon scp-strapdown" ng-if="tow.strapDown"
				ng-disabled="tow.strapBusy" ng-click="towCall('uiStrapDown()')"
				title="Strap it onto this vehicle">
				<span class="scp-ic"><svg aria-hidden="true"><use
							href="#sc-icon-straps" /></svg></span>
				<span class="scp-hookon-text"><b>Strap down</b><span
						ng-bind="tow.anchorVehicle"></span></span>
			</button>
			<div ng-if="!tow.anchorVehicle"
				ng-include="'/ui/modules/apps/SharedCareer-Phone/remote.html'"></div>
			<button class="scp-hookon" ng-if="!tow.anchorVehicle && tow.hookOn"
				ng-class="{'scp-hookon-hitch': tow.hookOn.hitch}"
				ng-click="towCall('uiHookOn()')"
				title="Put the anchor where the ring is">
				<span class="scp-ic"><svg aria-hidden="true"><use
							href="#sc-icon-anchor-vehicle" /></svg></span>
				<span class="scp-hookon-text"><b>Hook on</b><span
						ng-bind="tow.hookOn.vehicle"></span></span>
			</button>
		</div>
	</div>
</div>
