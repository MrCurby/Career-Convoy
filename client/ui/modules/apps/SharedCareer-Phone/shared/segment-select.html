<div class="scp-seg" role="radiogroup">
	<span class="scp-seg-label" ng-if="label" ng-bind="label"></span>
	<button ng-repeat="option in options track by option.id" ng-class="{'scp-seg-on': option.id === selected}"
		ng-click="onSelect({id: option.id})" role="radio" aria-checked="{{ option.id === selected }}">
		<scp-icon ng-if="option.icon" name="{{ option.icon }}"></scp-icon>
		<span class="scp-seg-name" ng-bind="option.name"></span>
	</button>
</div>
